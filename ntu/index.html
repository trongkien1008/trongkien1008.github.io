<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffd9a0">
<title>Khám Phá NTU</title>
<!-- Three.js (bản ES module) nạp qua CDN bằng importmap. Mọi thứ khác (hình khối, âm thanh) đều dựng bằng code. -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
/* ===== Giao diện: tông màu ấm, ưu tiên màn hình dọc của điện thoại ===== */
:root{--cream:#fff3dc;--paper:#fffaf0;--ink:#4a2f1b;--muted:#8a6a4f;--acc:#d9622b;--acc2:#b84a1c;--green:#4f9a5a;--gold:#f2b84b;--line:#ecd8b8;--sh:0 6px 18px rgba(80,40,10,.25);
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe2b8;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.glass{background:rgba(255,250,240,.92);border:2px solid #fff;box-shadow:var(--sh);backdrop-filter:blur(4px)}

/* --- Màn chào --- */
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:linear-gradient(#ffbf80 0%,#ffdca8 42%,#fff3dc 100%);overflow:hidden}
#splash .sun{position:absolute;top:8%;right:12%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fff3b0 0 35%,#ffd36b 36% 60%,rgba(255,211,107,0) 72%);}
#splash .hill{position:absolute;left:-10%;right:-10%;bottom:-8%;height:34%;background:#b7d385;border-radius:50% 50% 0 0/100% 100% 0 0}
#splash .hill.h2{bottom:-14%;height:30%;background:#9cc46f;left:20%;right:-30%}
#splash>*:not(.sun):not(.hill){position:relative;z-index:2}
#splash h1{margin:0;font-size:clamp(40px,12vw,72px);line-height:1.02;font-weight:900;color:#a8431a;text-shadow:0 3px 0 #fff3dc,0 8px 18px rgba(120,50,10,.3);letter-spacing:-.5px}
#splash h1 small{display:block;font-size:.34em;letter-spacing:.35em;color:#c9703a;font-weight:700;text-shadow:none;margin-bottom:6px}
#splash p{margin:0;max-width:30em;color:#6b4a30;font-size:15px;line-height:1.5}
#nameBox{display:flex;flex-direction:column;gap:6px;align-items:stretch;width:min(320px,86vw);margin-top:6px}
#nameBox label{font-size:13px;font-weight:700;color:#8a5a36;text-align:left}
#nameIn{height:50px;border-radius:14px;border:2px solid #f0c58f;background:#fffaf0;padding:0 16px;font-size:18px;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text;text-align:center}
#nameIn:focus{border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:26px;background:var(--acc);color:#fff;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--acc2),var(--sh);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--acc2)}
.btn[disabled]{opacity:.6}
.btn.ghost{background:#fffaf0;color:var(--acc2);box-shadow:0 4px 0 #ecd8b8,var(--sh);border:2px solid #f0c58f}
.btn.small{min-height:40px;padding:0 16px;font-size:15px}
#goBtn{width:min(320px,86vw);font-size:22px;min-height:60px;margin-top:6px}
#splash .fine{font-size:12px;color:#8a6a4f;opacity:.9;margin-top:4px}
#loadMsg{font-size:13px;color:#8a6a4f;min-height:18px}

/* --- HUD --- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#stats{position:absolute;left:calc(10px + var(--safe-l));top:calc(10px + var(--safe-t));display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.chip{padding:5px 11px;border-radius:16px;font-weight:800;font-size:13px;white-space:nowrap}
.chip b{color:var(--acc2)}
#quest{position:absolute;left:calc(10px + var(--safe-l));top:calc(126px + var(--safe-t));display:flex;flex-direction:column;gap:8px}
.q{width:46px;height:46px;border-radius:50%;font-size:22px;position:relative;display:grid;place-items:center}
.q.on{outline:3px solid var(--gold);outline-offset:1px}
.q.done::after{content:'✓';position:absolute;right:-3px;bottom:-3px;background:var(--green);color:#fff;border-radius:50%;width:19px;height:19px;font-size:12px;font-weight:900;display:grid;place-items:center}
#tr{position:absolute;right:calc(10px + var(--safe-r));top:calc(10px + var(--safe-t));display:flex;gap:7px}
#tr{gap:6px}#tr button.on{outline:3px solid var(--gold)}
#tr button{width:42px;height:42px;border-radius:50%;font-size:20px;display:grid;place-items:center}
#mini{position:absolute;right:calc(10px + var(--safe-r));top:calc(62px + var(--safe-t));width:132px;height:92px;border-radius:14px;border:2px solid #fff;box-shadow:var(--sh);background:rgba(255,250,240,.6)}
#joy{position:absolute;left:calc(22px + var(--safe-l));bottom:calc(26px + var(--safe-b));width:132px;height:132px;border-radius:50%;background:rgba(255,250,240,.38);border:3px solid rgba(255,255,255,.75);touch-action:none;box-shadow:inset 0 0 18px rgba(120,60,20,.15)}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,250,240,.92);border:3px solid #fff;box-shadow:var(--sh)}
#act{position:absolute;right:calc(18px + var(--safe-r));bottom:calc(34px + var(--safe-b));min-width:168px;max-width:62vw;min-height:68px;padding:8px 22px;border-radius:34px;background:var(--acc);color:#fff;font-weight:900;font-size:19px;line-height:1.15;box-shadow:0 6px 0 var(--acc2),var(--sh);animation:pulse 1.4s infinite;display:flex;flex-direction:column;align-items:center;justify-content:center}
#act small{font-size:12px;font-weight:700;opacity:.9}
#act:active{transform:translateY(3px)}
@keyframes pulse{50%{transform:scale(1.045)}}
#arrow{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;display:flex;flex-direction:column;align-items:center;pointer-events:none!important;text-shadow:0 2px 6px rgba(80,30,0,.5)}
#arrow i{font-style:normal;font-size:34px;color:#fff;display:block;line-height:38px;filter:drop-shadow(0 2px 3px rgba(80,30,0,.6))}
#arrow b{font-size:13px;color:#fff;background:rgba(150,60,20,.8);padding:1px 8px;border-radius:10px}
#toast{position:absolute;left:50%;top:calc(66px + var(--safe-t));transform:translateX(-50%);max-width:86vw;pointer-events:none!important;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{padding:8px 16px;border-radius:18px;font-weight:800;font-size:14px;text-align:center;animation:tin .25s ease-out;background:rgba(74,47,27,.92);color:#fff3dc}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#runbar{position:absolute;left:50%;top:calc(66px + var(--safe-t));transform:translateX(-50%);padding:8px 14px;border-radius:20px;font-weight:800;display:flex;gap:10px;align-items:center;font-size:15px;white-space:nowrap}
#runbar button{background:#f3d7b3;border-radius:14px;padding:4px 12px;font-weight:800;font-size:13px}

/* --- Nhãn trên đầu & bong bóng chữ --- */
#labels,#bubbles{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);padding:1px 7px;border-radius:9px;font-size:12px;font-weight:800;color:#6b2d10;background:rgba(255,248,232,.88);white-space:nowrap;box-shadow:0 1px 4px rgba(80,30,0,.25);will-change:transform}
.lbl.big{font-size:13px;background:rgba(255,236,196,.95)}
.bub{position:absolute;left:0;top:0;max-width:170px;padding:6px 10px;border-radius:14px;background:#fffdf6;color:#4a2f1b;font-size:12.5px;font-weight:700;line-height:1.3;text-align:center;box-shadow:0 3px 10px rgba(80,30,0,.28);transition:opacity .25s;will-change:transform}
.bub::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fffdf6;border-bottom:0}
#nameTag{position:absolute;left:0;top:0;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:900;color:#fff;background:rgba(217,98,43,.92);white-space:nowrap;will-change:transform}

/* --- Hộp thoại (trò chơi nhỏ, sổ, chia sẻ) --- */
#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(14px + var(--safe-t)) calc(14px + var(--safe-r)) calc(14px + var(--safe-b)) calc(14px + var(--safe-l));background:rgba(70,35,10,.45);touch-action:pan-y}
#mbox{position:relative;width:min(460px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:22px;padding:20px 18px 18px;box-shadow:0 14px 40px rgba(60,25,0,.45);border:3px solid #fff;-webkit-user-select:text;user-select:text}
#mclose{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:#f6e2c4;font-size:16px;font-weight:900;z-index:2}
#mbody h2{margin:0 0 4px;font-size:21px;color:var(--acc2);padding-right:34px}
#mbody p{margin:6px 0;line-height:1.5;font-size:15px}
#mbody .muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:16px;font-weight:700}
.opt:active{background:#fff0d6}
.opt.ok{background:#dff3dc;border-color:#7cc47a}.opt.no{background:#fde0d8;border-color:#e59a86}
.bigname{font-size:30px;font-weight:900;text-align:center;padding:22px 8px;border-radius:18px;background:#fff;border:2px dashed #e8c590;min-height:90px;color:#7a3a14;display:flex;align-items:center;justify-content:center;word-break:break-word}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:10px;height:10px;border-radius:50%;background:#ecd8b8}.dots i.on{background:var(--acc)}
textarea{width:100%;min-height:110px;border-radius:14px;border:2px solid #f0c58f;background:#fffdf6;padding:12px;font:inherit;font-size:16px;color:var(--ink);resize:none;outline:none;-webkit-user-select:text;user-select:text}
textarea:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:6px 11px;border-radius:14px;background:#fff0d6;border:1px solid #f0c58f;font-size:13px;font-weight:700}
.cnt{text-align:right;font-size:12px;color:var(--muted)}
.tube{width:150px;height:190px;margin:6px auto;position:relative;touch-action:none}
.tube svg{width:100%;height:100%;overflow:visible}
.shaking .tube svg{animation:shake .18s infinite}
@keyframes shake{0%{transform:rotate(-9deg) translateX(-4px)}50%{transform:rotate(9deg) translateX(4px)}100%{transform:rotate(-9deg) translateX(-4px)}}
.bar{height:14px;border-radius:8px;background:#f1dfc2;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2b84b,#d9622b);transition:width .1s}
.stick{margin:10px auto;width:min(250px,80%);padding:16px 14px 14px;border-radius:12px;background:linear-gradient(#fff6dc,#f6e0b0);border:3px solid #c98b4a;box-shadow:var(--sh);text-align:center;animation:drop .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translateY(-120px) rotate(-25deg);opacity:0}}
.stick .no{font-size:13px;font-weight:900;color:#a8431a;letter-spacing:.12em}
.stick .tx{font-size:18px;font-weight:800;line-height:1.4;margin:8px 0;color:#5a2d10}
.stick .en{font-size:12px;color:#8a6a4f;font-weight:700}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat3 div{background:#fff;border:2px solid var(--line);border-radius:12px;text-align:center;padding:8px 2px;font-size:12px;color:var(--muted);font-weight:700}
.stat3 b{display:block;font-size:20px;color:var(--acc2)}
.entry{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.45}
.entry small{display:block;color:var(--muted);margin-top:4px}
.entry button{margin-top:6px;padding:4px 12px;border-radius:12px;background:#fff0d6;border:1px solid #f0c58f;font-size:13px;font-weight:700}
#mbody h3{margin:14px 0 2px;font-size:15px;color:#7a3a14}
#mbody img.share{width:100%;max-height:58vh;object-fit:contain;border-radius:14px;display:block;margin:8px auto;box-shadow:var(--sh)}
.pass{font-size:48px;text-align:center}

/* --- Hướng dẫn 3 bước --- */
#tut{position:fixed;inset:0;z-index:45;background:rgba(70,35,10,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px calc(16px + var(--safe-r)) calc(24px + var(--safe-b)) calc(16px + var(--safe-l))}
#tutBox{width:min(440px,100%);background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 14px 40px rgba(60,25,0,.45);border:3px solid #fff;text-align:center}
#tutBox .ic{font-size:44px}#tutBox h2{margin:4px 0;color:var(--acc2);font-size:21px}#tutBox p{margin:4px 0 8px;line-height:1.5}
@media (min-width:700px){#joy{display:none}#act{min-height:64px}}
@media (max-height:520px){#quest{top:calc(112px + var(--safe-t))}.q{width:38px;height:38px;font-size:18px}#mini{width:110px;height:76px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Khuôn viên 3D"></canvas>
<div id="labels"></div><div id="bubbles"></div><div id="nameTag" hidden></div>

<!-- Màn chào: hiện ngay, không chờ tải 3D -->
<div id="splash">
  <div class="sun"></div><div class="hill"></div><div class="hill h2"></div>
  <h1><small>KHUÔN VIÊN 3D</small>Khám Phá<br>NTU</h1>
  <p>Dạo quanh khuôn viên, điểm danh, đi học, chạy bộ, viết lời cầu qua môn và xin một quẻ học hành nhẹ nhàng.</p>
  <div id="nameBox"><label for="nameIn">Tên của bạn</label><input id="nameIn" maxlength="20" placeholder="Ví dụ: Kiên" autocomplete="off" enterkeyhint="go"></div>
  <button class="btn" id="goBtn" disabled>Đang tải khuôn viên…</button>
  <div id="loadMsg"></div>
  <div class="fine">Không đăng nhập · không thu thập dữ liệu · không quảng cáo. Âm thanh bật khi bạn vào trường.</div>
</div>

<div id="hud" hidden>
  <div id="stats"><span class="chip glass">Tâm an <b id="cScore">0</b></span><span class="chip glass">Cao nhất <b id="cBest">0</b></span><span class="chip glass" id="cEnv" style="pointer-events:auto;cursor:pointer" title="Chạm để đổi thời tiết">☀️ --:--</span></div>
  <div id="quest">
    <button class="q glass" data-t="att" aria-label="Điểm danh">✅</button>
    <button class="q glass" data-t="cls" aria-label="Đi học">📚</button>
    <button class="q glass" data-t="run" aria-label="Chạy thể dục">🏃</button>
    <button class="q glass" data-t="pray" aria-label="Viết lời cầu">🎀</button>
    <button class="q glass" data-t="que" aria-label="Xin quẻ">🎋</button>
  </div>
  <div id="tr">
    <button class="glass" id="bDrone" aria-label="Góc nhìn drone">🚁</button>
    <button class="glass" id="bMute" aria-label="Bật tắt tiếng">🔊</button>
    <button class="glass" id="bBook" aria-label="Sổ cầu an của tôi">📖</button>
    <button class="glass" id="bShare" aria-label="Chia sẻ">📤</button>
    <button class="glass" id="bHelp" aria-label="Hướng dẫn">?</button>
  </div>
  <canvas id="mini" width="264" height="184"></canvas>
  <div id="joy"><div id="knob"></div></div>
  <button id="act" hidden></button>
  <div id="arrow" hidden><i>➤</i><b></b></div>
  <div id="toast"></div>
  <div id="runbar" class="glass" hidden><span id="runTxt"></span><button id="runStop">Dừng</button></div>
</div>

<div id="modal" hidden><div id="mbox"><button id="mclose" aria-label="Đóng">✕</button><div id="mbody"></div></div></div>
<div id="tut" hidden><div id="tutBox"><div class="ic" id="tutIc"></div><h2 id="tutH"></h2><p id="tutP"></p><div class="dots" id="tutDots"></div><div class="row"><button class="btn ghost small" id="tutSkip">Bỏ qua</button><button class="btn small" id="tutNext">Tiếp</button></div></div></div>

<script type="module">
/* =====================================================================
   KHÁM PHÁ NTU: game 3D khuôn viên (một file duy nhất)
   Các phần: 1 Tiện ích & lưu trữ · 2 Dữ liệu khuôn viên · 3 Khởi tạo 3D ·
   4 Dựng thế giới · 5 Nhân vật & va chạm · 6 Khách AI · 7 Âm thanh ·
   8 Giao diện & trò chơi nhỏ · 9 Chia sẻ ảnh · 10 Vòng lặp chính
   ===================================================================== */
import * as THREE from 'three';

/* ========== 1. TIỆN ÍCH & LƯU TRỮ ========== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const IS_TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
const LOW=IS_TOUCH||(navigator.hardwareConcurrency||8)<=4;   // máy yếu/điện thoại: giảm tải
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RND=mulberry(20261104);                                   // ngẫu nhiên cố định cho cảnh (cây, hoa)
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
function fatal(msg){const m=$('#loadMsg');if(m)m.textContent=msg;const b=$('#goBtn');if(b){b.textContent='Không chạy được';b.disabled=true}}

// Dữ liệu lưu trên máy (localStorage): tên, số lần điểm danh, điểm Tâm an cao nhất, lời cầu, quẻ.
const KEY='kham-pha-ntu-v1';
let save={name:'',checkins:0,classes:0,runs:0,best:0,prayers:[],draws:[],seenTut:false,muted:false};
try{
  const r=JSON.parse(localStorage.getItem(KEY)||'null');
  if(r&&typeof r==='object'){
    save.name=String(r.name||'').slice(0,20);
    ['checkins','classes','runs','best'].forEach(k=>save[k]=Math.max(0,+r[k]||0));
    save.prayers=(Array.isArray(r.prayers)?r.prayers:[]).slice(-100).map(p=>({text:String(p.text||'').slice(0,120),ts:+p.ts||0}));
    save.draws=(Array.isArray(r.draws)?r.draws:[]).slice(-100).map(p=>({n:+p.n||1,text:String(p.text||'').slice(0,200),ts:+p.ts||0}));
    save.seenTut=!!r.seenTut;save.muted=!!r.muted;
  }
}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
let SCORE=0;   // điểm Tâm an của lượt chơi này; điểm cao nhất được lưu

/* ========== 2. DỮ LIỆU KHUÔN VIÊN (dựng theo sơ đồ) ========== */
// Tọa độ gốc là pixel của sơ đồ (rộng 1500). 10 pixel = 1 đơn vị thế giới; X sang phải, Z xuống dưới (Nam).

const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_p=new THREE.Vector3(),_s=new THREE.Vector3();
function M(x,y,z,sx=1,sy=1,sz=1,ry=0,rx=0,rz=0){_e.set(rx,ry,rz);_q.setFromEuler(_e);return _m.compose(_p.set(x,y,z),_q,_s.set(sx,sy,sz)).clone()}
function hipM(x,y,z,sx,sy,sz){return new THREE.Matrix4().makeTranslation(x,y,z).multiply(new THREE.Matrix4().makeScale(sx,sy,sz)).multiply(new THREE.Matrix4().makeRotationY(Math.PI/4))}
const UNIT_BOX=new THREE.BoxGeometry(1,1,1),CONE4=new THREE.ConeGeometry(1,1,4,1);
class Batch{
  constructor(){this.p=[];this.n=[];this.c=[];this.u=[];this.i=[];this.v=0}
  add(geo,m,color,uvf){
    const P=geo.attributes.position,N=geo.attributes.normal,U=geo.attributes.uv,I=geo.index;
    const nm=new THREE.Matrix3().getNormalMatrix(m),c=new THREE.Color(color),v=new THREE.Vector3();
    for(let k=0;k<P.count;k++){
      v.fromBufferAttribute(P,k).applyMatrix4(m);this.p.push(v.x,v.y,v.z);
      v.fromBufferAttribute(N,k).applyMatrix3(nm).normalize();this.n.push(v.x,v.y,v.z);
      this.c.push(c.r,c.g,c.b);let u=U.getX(k),w=U.getY(k);if(uvf){const t=uvf(u,w,k);u=t[0];w=t[1]}this.u.push(u,w);
    }
    if(I)for(let k=0;k<I.count;k++)this.i.push(I.getX(k)+this.v);else for(let k=0;k<P.count;k++)this.i.push(k+this.v);
    this.v+=P.count;
  }
  box(x,y,z,w,h,d,color,ry=0){this.add(UNIT_BOX,M(x,y,z,w,h,d,ry),color)}
  // Tường có cửa sổ: lặp họa tiết theo kích thước thật (Tu mét/ô ngang, Tv mét/tầng)
  wall(x,y,z,w,h,d,color,Tu,Tv){
    this.add(UNIT_BOX,M(x,y,z,w,h,d),color,(u,v,k)=>{const f=k>>2;
      if(f<2)return[u*d/Tu,v*h/Tv];if(f<4)return[u*w/Tu,v*d/Tu];return[u*w/Tu,v*h/Tv]});
  }
  mesh(mat,cast=true,recv=true){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(this.u,2));
    g.setIndex(new THREE.Uint32BufferAttribute(this.i,1));g.computeBoundingSphere();
    const m=new THREE.Mesh(g,mat);m.castShadow=cast;m.receiveShadow=recv;return m;
  }
}

/* ---------- Điểm hoạt động (hotspot) ---------- */
function blockedAt(x,z,r){
  for(const c of colliders){const px=clamp(x,c.x0,c.x1),pz=clamp(z,c.z0,c.z1);if(Math.hypot(x-px,z-pz)<r)return true}
  for(const c of circles)if(Math.hypot(x-c.x,z-c.z)<c.r+r)return true;
  return false;
}
function findFree(x,z,r=.8){
  if(!blockedAt(x,z,r)&&inCampus(x,z,.8))return[x,z];

function updateAgents(dt){

// Tiếng nền: gió, lá xào xạc, chim hót, biển rì rầm từ xa (to dần khi lại gần biển). Có nút tắt tiếng.
const AU={ctx:null,master:null,seaVol:null,leafG:null,muted:save.muted,buf:null,birds:0};
function audioStart(){
  if(AU.ctx){if(AU.ctx.state==='suspended'&&!AU.muted)AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  let ctx;try{ctx=AU.ctx=new C()}catch(e){return}
  const master=AU.master=ctx.createGain();master.gain.value=AU.muted?0:.9;master.connect(ctx.destination);
  const len=ctx.sampleRate*3,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);let b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.05;d[i]=(b0+b1+b2+w*.18)*.18}   // nhiễu hồng (êm hơn nhiễu trắng)
  AU.buf=buf;
  const noise=()=>{const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.start(0,Math.random()*2);return s};
  // Gió: nhiễu lọc dải, âm lượng lên xuống chậm
  {const s=noise(),f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=520;f.Q.value=.45;const g=ctx.createGain();g.gain.value=1.1;
   const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.07;lg.gain.value=.55;l.connect(lg).connect(g.gain);l.start();s.connect(f).connect(g).connect(master)}
  // Biển: nhiễu trầm, sóng dâng hạ chu kỳ khoảng 9 giây
  {const s=noise(),f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=480;const sw=ctx.createGain();sw.gain.value=.65;
   const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.11;lg.gain.value=.35;l.connect(lg).connect(sw.gain);l.start();
   const v=AU.seaVol=ctx.createGain();v.gain.value=.8;s.connect(f).connect(sw).connect(v).connect(master)}
  // Lá xào xạc: nhiễu cao, từng đợt ngắn
  {const s=noise(),h=ctx.createBiquadFilter();h.type='highpass';h.frequency.value=2400;const b=ctx.createBiquadFilter();b.type='bandpass';b.frequency.value=5200;b.Q.value=.6;
   const g=AU.leafG=ctx.createGain();g.gain.value=0;s.connect(h).connect(b).connect(g).connect(master)
   setInterval(()=>{if(ctx.state!=='running')return;const t=ctx.currentTime;if(Math.random()<.6){g.gain.setTargetAtTime(1.6+Math.random()*2.2,t,.18);g.gain.setTargetAtTime(.1,t+.3,.35)}},700)}
  {const s=noise(),h=ctx.createBiquadFilter();h.type='highpass';h.frequency.value=1400;const g=AU.rainG=ctx.createGain();g.gain.value=0;s.connect(h).connect(g).connect(master)}   // tiếng mưa
  scheduleBird();
}
function setRainSound(v){if(AU.rainG)AU.rainG.gain.setTargetAtTime(v*2.4,AU.ctx.currentTime,.8)}
function chirp(){
  const c=AU.ctx;if(!c||c.state!=='running'||AU.muted)return;
  const base=2200+Math.random()*2200,n=2+Math.floor(Math.random()*4),pan=c.createStereoPanner?c.createStereoPanner():null,out=c.createGain();out.gain.value=.05+Math.random()*.05;
  if(pan){pan.pan.value=Math.random()*2-1;out.connect(pan).connect(AU.master)}else out.connect(AU.master);
  let t=c.currentTime+.02;
  for(let i=0;i<n;i++){const o=c.createOscillator(),g=c.createGain(),f=base*(1+(Math.random()-.5)*.25),dur=.05+Math.random()*.06;
    o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*(Math.random()<.5?1.35:.75),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(out);o.start(t);o.stop(t+dur+.02);t+=dur+.03+Math.random()*.05}
}

  window.__gymRoof.visible=!(player.x>GYM.x0-.2&&player.x<GYM.x1+.2&&player.z>GYM.z0-.2&&player.z<GYM.z1+.2);
  clouds.forEach(c=>{c.position.x+=dt*1.2;if(c.position.x>170)c.position.x=-170});window.__sea.offset.x+=dt*.006;window.__sea.offset.y+=dt*.003;
  // --- điểm hoạt động ---
  let nh=null,nd=3.4;
  for(const h of HOT){const d=Math.hypot(h.x-player.x,h.z-player.z),p=1+Math.sin(now/300+h.x)*.12;h.ring.scale.setScalar(p);h.gem.rotation.y=now/500;h.gem.position.y=2.4+Math.sin(now/400+h.z)*.2;
    h.ring.material.opacity=h.done?.3:.85;h.gem.visible=!h.done;h.beam.visible=!h.done;if(d<nd&&!RUN.on&&!ui.modal){nd=d;nh=h}}
  setNear(nh);
  const gtg=guideTarget(),ar=$('#arrow');
  if(gtg&&gtg.d>5){const rx=cy,rz=-sy,fx=-sy,fz=-cy,ddx=gtg.h.x-player.x,ddz=gtg.h.z-player.z,a=Math.atan2(ddx*rx+ddz*rz,ddx*fx+ddz*fz),R=Math.min(innerWidth,innerHeight)*.3;
    ar.hidden=false;ar.style.transform='translate('+Math.sin(a)*R+'px,'+(-Math.cos(a)*R)+'px)';ar.firstChild.style.transform='rotate('+(a-Math.PI/2)+'rad)';ar.lastChild.textContent=Math.round(gtg.d)+' m'}
  else if(guide)ar.hidden=true;
  // --- nhãn & tên ---
  for(let i=0;i<LABELS.length;i++){const l=LABELS[i],d=Math.hypot(l.x-player.x,l.z-player.z),e=lblEls[i];
    const LD=ui.drone?90:44;if(d>LD){e.hidden=true;continue}const s=toScreen(l.x,l.y,l.z);if(!s.vis){e.hidden=true;continue}e.hidden=false;e.style.opacity=clamp((LD-d)/14,0,1);e.style.transform='translate('+s.x+'px,'+s.y+'px) translate(-50%,-50%)'}
  const ts=toScreen(player.x,2.05,player.z);tag.style.transform='translate('+ts.x+'px,'+ts.y+'px) translate(-50%,-100%)';
  envFrame(dt,now);
  if(frames%3===0)drawMini(now);
  if(frames%20===0)audioFrame();
  renderer.render(scene,camera);
}

/* ---------- Màn chào → vào trường ---------- */
const nameIn=$('#nameIn'),goBtn=$('#goBtn');
nameIn.value=save.name;
function enterGame(){
  if(ui.started)return;const n=nameIn.value.replace(/\s+/g,' ').trim().slice(0,20);save.name=n||'Sinh viên NTU';persist();
  audioStart();setMuted(AU.muted);ui.started=true;$('#splash').hidden=true;$('#hud').hidden=false;
  tag.hidden=false;tag.textContent=save.name;updateChips();
  const sp=save.prayers.slice(-RIB_SLOTS.length);const base=save.prayers.length-sp.length;sp.forEach((p,i)=>hangRibbon(base+i,p.text,save.name,false));
  if(!save.seenTut)showTut();
  lastT=performance.now();requestAnimationFrame(frame);
}
goBtn.addEventListener('click',enterGame);
nameIn.addEventListener('keydown',e=>{if(e.key==='Enter')enterGame()});
renderer.compile(scene,camera);renderer.render(scene,camera);
goBtn.disabled=false;goBtn.textContent='Vào Trường';
window.__ntu={ENV,setWeather,player,HOT,agents,camS,ui,save,enter:enterGame,RUN,runPos:()=>RUN.pts[RUN.i]};
</script>
